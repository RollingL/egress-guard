[package]
name = "egress-guard"
version = "0.7.0"
edition = "2021"
description = "根据本机公网出口 IP 判断是否阻断选中应用（Windows：WFP；macOS：网络扩展）或全部网络（Windows：WFP；macOS：pf）的连接"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
ipnet = { version = "2", features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# 界面在 Windows、macOS 上发布；Linux 仅用于开发时预览界面
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.26"
rfd = "0.18"
dispatch2 = "0.3"
winit = { version = "0.30", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
rfd = "0.18"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[[bin]]
name = "egress-guard"
path = "src/bin/cli.rs"

[[bin]]
name = "egress-guard-gui"
path = "src/bin/gui.rs"

[profile.release]
lto = true
strip = true
