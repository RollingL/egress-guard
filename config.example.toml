# egress-guard 配置示例。复制为 config.toml 后修改。
#
# 规则：本机公网出口 IP 命中 whitelist 中任一条目 → 放行 apps；
#       否则（或检测失败达到阈值）→ 用 WFP 阻断 apps 的全部网络连接。
#
# macOS 版：pf 防火墙不能按应用区分，apps 不生效，请开启 [block_all] 全局断网。
# macOS 上配置由后台服务保存在 /Library/Application Support/EgressGuard/config.toml，
# 用界面修改，或执行 egress-guard apply <文件>。

# 出口 IP 白名单：支持单个 IPv4/IPv6 地址和 CIDR 网段
whitelist = [
    "203.0.113.10",       # 例：公司固定出口 IP
    "198.51.100.0/24",    # 例：VPN 出口网段
    # "2001:db8::/32",
]

# 受控应用：exe 的完整路径（用单引号，反斜杠无需转义）
apps = [
    'C:\Program Files\Google\Chrome\Application\chrome.exe',
    # 'C:\Users\you\AppData\Local\Programs\SomeApp\SomeApp.exe',
]

[detect]
# 定时检测间隔（秒）。网卡/地址/路由变化时会立即额外检测一次
interval_secs = 60
# 每个查询服务的超时（秒）
timeout_secs = 5
# 公网 IP 查询服务，按顺序尝试，第一个成功的结果生效。
# 响应可以是纯 IP，也可以是包含 IP 的一段文字。
# 注意：如果用分流 VPN/代理，请选与受控应用走同一出口的服务。
services = [
    "https://4.ipw.cn",
    "https://api.ipify.org",
    "https://ifconfig.me/ip",
    "https://checkip.amazonaws.com",
]
# 检测失败时：block（阻断，默认）/ allow（放行）/ keep（保持现状）
fail_mode = "block"
# 连续失败多少次后才执行 fail_mode
failure_threshold = 2

[behavior]
# 启动时先阻断，确认出口 IP 在白名单后再放行
start_blocked = true
# 网络变化时立即先阻断，重新检测确认后再放行（防止切换瞬间泄漏）
block_on_network_change = true
# 切换为阻断时，主动断开受控应用已有的 IPv4 TCP 连接
kill_existing_tcp = true
# 网络变化事件防抖（毫秒）
debounce_ms = 2000

[children]
# 自动识别受控应用启动的子进程（即使是不同的 exe），一起阻断：
#   tree（默认）= 整棵进程树；off = 关闭
# 识别结果保存在配置文件旁的 learned-apps.txt，下次启动立即生效。
# Windows 系统目录下的程序（cmd.exe、conhost.exe 等）永远不会被自动加入。
mode = "tree"
# 同时阻断受控应用 exe 所在目录（含子目录）下的全部 exe（尚未运行的辅助程序也会被提前阻断）
include_app_dir = false
# 不自动阻断的程序（完整路径），例如被应用调起的浏览器
exclude = [
    # 'C:\Program Files\Mozilla Firefox\firefox.exe',
]

[block_all]
# 全局断网：出口 IP 不在白名单时切断本机全部网络（而不只是 apps 中的程序）。
# 始终放行：本工具自身（用于继续检测出口 IP）、回环地址、DHCP。
# apps 中的受控应用不受下面的例外影响，阻断时仍完全断网。退出程序即恢复全部网络。
enabled = false
# 放行局域网（10/8、172.16/12、192.168/16、169.254/16、组播、fe80::/10、fc00::/7）
allow_lan = true
# 放行 DNS 查询（远端端口 53）。关闭后本工具也可能无法检测出口 IP
allow_dns = true
# 例外程序（完整路径），如 VPN 客户端：断网时仍需要它连上 VPN
allow_apps = [
    # 'C:\Program Files\OpenVPN\bin\openvpn.exe',
]
# 例外远端地址/网段，如 VPN 服务器。WireGuard 等由内核发包的 VPN 只能用这种方式放行
allow_remote = [
    # "198.51.100.7",
]

[ui]
# 界面外观：system（跟随系统）/ light（浅色）/ dark（深色）。命令行版本忽略此项
appearance = "system"

[leak_test]
# 泄露测试（界面「泄露测试」页、命令行 egress-guard leak-test）。
# 界面在后台自动测试：出口放行后、出口 IP 变化后等 10 秒测一次；之后按 interval_mins 定时测试。
# 自动测试由界面进行，命令行版本只在执行 leak-test 时测试。
# 网络变化后（刚放行、出口 IP 变化）自动测试
auto_after_change = true
# 定时测试的间隔（分钟），距上次测试（手动或自动）满这么久再测；0 = 不定时测试
interval_mins = 60
# 自动测试发现泄露时发系统通知（同一出口、同样的结论只提醒一次）
notify = true
# 可信 DNS 解析器：IP、CIDR 或自治系统号。DNS 泄露测试发现的解析器在这里或在出口 IP 白名单内时，不算泄露。
# 用 Cloudflare、Google 等公共解析器时，它们向外查询的 IP 不固定，按自治系统信任更方便。
trusted_dns = [
    # "AS13335",          # Cloudflare 1.1.1.1
    # "198.51.100.53",
]
# DNS 测试服务的域名：addr.tools 的 dnscheck（开源，可自建）
dnscheck_zone = "dnscheck.tools"
# DNS 检测源：dnscheck（WebSocket 实时推送，能看到全部解析器和 ECS），
# 以及 ip-api、every1dns、fastly、surfshark、ipleak、browserleaks（每个发一次 HTTP 请求，只看到一个解析器）
dns_sources = ["dnscheck", "ip-api", "every1dns", "fastly", "surfshark", "ipleak", "browserleaks"]
# WebRTC 泄露测试用的 STUN 服务器（主机:端口），按顺序尝试
stun_servers = ["myip.addr.tools:3478", "stun.cloudflare.com:3478", "stun.l.google.com:19302", "stun.miwifi.com:3478"]

[vpn]
# VPN 守护：放行时记下正在使用的 VPN 网卡，之后它断开（网卡消失、关闭或失去地址）就立即阻断，
# 不等下一次出口 IP 检测，也不受 behavior.block_on_network_change 的影响。
guard = true
# 要守护的网卡名称（Windows 为「以太网 2」这样的名称，也可以填网卡描述；macOS 为 utun4 等）。
# 留空时自动识别：utun、tun、tap、ppp、ipsec、wg、tailscale 等名称，Windows 上还看接口类型与描述
# （WireGuard、OpenVPN、TAP-Windows、Wintun 等）。只算有可用地址（不只是 fe80::）的网卡。
interfaces = []
# 通过 VPN 放行期间的检测间隔（秒），比 detect.interval_secs 更勤；0 = 与平时相同
check_interval_secs = 15

[ipv6]
# IPv6 防护：
#   check（默认）= 另外只走 IPv6 检测一次出口；本机能直连 IPv6 且这个地址不在白名单内时也阻断
#                 （常见于 VPN 只接管 IPv4，IPv6 流量仍然直连）
#   block        = 始终阻断受控应用的 IPv6（开启全局断网时为全部 IPv6，例外同全局断网），放行时也一样
#   off          = 不处理 IPv6
mode = "check"
# 只走 IPv6 的出口查询服务，同时查询，取第一个成功结果
services = ["https://6.ipw.cn", "https://api6.ipify.org", "https://v6.ident.me"]

[update]
# 界面启动 20 秒后、之后每天检查一次 GitHub Releases，有新版本时提醒（只提醒，不会自动下载安装）
check = true
# 发布所在的仓库（所有者/仓库名）
repo = "RollingL/egress-guard"
# 私有仓库需要一个有读取权限的 GitHub 令牌（fine-grained token 只勾选 Contents: Read）；公开仓库留空
token = ""
