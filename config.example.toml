# egress-guard 配置示例。复制为 config.toml 后修改。
#
# 规则：本机公网出口 IP 命中 whitelist 中任一条目 → 放行 apps；
#       否则（或检测失败达到阈值）→ 用 WFP 阻断 apps 的全部网络连接。

# 出口 IP 白名单：支持单个 IPv4/IPv6 地址和 CIDR 网段
whitelist = [
    "203.0.113.10",       # 例：公司固定出口 IP
    "198.51.100.0/24",    # 例：VPN 出口网段
    # "2001:db8::/32",
]

# 受控应用：exe 的完整路径（用单引号，反斜杠无需转义）
apps = [
    'C:\Program Files\Google\Chrome\Application\chrome.exe',
    # 'C:\Users\you\AppData\Local\Programs\SomeApp\SomeApp.exe',
]

[detect]
# 定时检测间隔（秒）。网卡/地址/路由变化时会立即额外检测一次
interval_secs = 60
# 每个查询服务的超时（秒）
timeout_secs = 5
# 公网 IP 查询服务，按顺序尝试，第一个成功的结果生效。
# 响应可以是纯 IP，也可以是包含 IP 的一段文字。
# 注意：如果用分流 VPN/代理，请选与受控应用走同一出口的服务。
services = [
    "https://4.ipw.cn",
    "https://api.ipify.org",
    "https://ifconfig.me/ip",
    "https://checkip.amazonaws.com",
]
# 检测失败时：block（阻断，默认）/ allow（放行）/ keep（保持现状）
fail_mode = "block"
# 连续失败多少次后才执行 fail_mode
failure_threshold = 2

[behavior]
# 启动时先阻断，确认出口 IP 在白名单后再放行
start_blocked = true
# 网络变化时立即先阻断，重新检测确认后再放行（防止切换瞬间泄漏）
block_on_network_change = true
# 切换为阻断时，主动断开受控应用已有的 IPv4 TCP 连接
kill_existing_tcp = true
# 网络变化事件防抖（毫秒）
debounce_ms = 2000

[children]
# 自动识别受控应用启动的子进程（即使是不同的 exe），一起阻断：
#   tree（默认）= 整棵进程树；off = 关闭
# 识别结果保存在配置文件旁的 learned-apps.txt，下次启动立即生效。
# Windows 系统目录下的程序（cmd.exe、conhost.exe 等）永远不会被自动加入。
mode = "tree"
# 同时阻断受控应用 exe 所在目录（含子目录）下的全部 exe（尚未运行的辅助程序也会被提前阻断）
include_app_dir = false
# 不自动阻断的程序（完整路径），例如被应用调起的浏览器
exclude = [
    # 'C:\Program Files\Mozilla Firefox\firefox.exe',
]

[block_all]
# 全局断网：出口 IP 不在白名单时切断本机全部网络（而不只是 apps 中的程序）。
# 始终放行：本工具自身（用于继续检测出口 IP）、回环地址、DHCP。
# apps 中的受控应用不受下面的例外影响，阻断时仍完全断网。退出程序即恢复全部网络。
enabled = false
# 放行局域网（10/8、172.16/12、192.168/16、169.254/16、组播、fe80::/10、fc00::/7）
allow_lan = true
# 放行 DNS 查询（远端端口 53）。关闭后本工具也可能无法检测出口 IP
allow_dns = true
# 例外程序（完整路径），如 VPN 客户端：断网时仍需要它连上 VPN
allow_apps = [
    # 'C:\Program Files\OpenVPN\bin\openvpn.exe',
]
# 例外远端地址/网段，如 VPN 服务器。WireGuard 等由内核发包的 VPN 只能用这种方式放行
allow_remote = [
    # "198.51.100.7",
]

[ui]
# 界面外观：system（跟随系统）/ light（浅色）/ dark（深色）。命令行版本忽略此项
appearance = "system"
