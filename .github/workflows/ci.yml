name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: 单元测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      # GitHub 的 Windows 虚拟机没有显卡驱动，只有 OpenGL 1.1，界面（OpenGL 2.0+）打不开。
      # 自检时把 Mesa 的软件渲染 opengl32.dll 放在程序旁边（只在 CI 的临时目录里，发布的程序不带）。
      - name: 准备软件渲染的 OpenGL（Mesa llvmpipe）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -match 'release-msvc\.7z$' } | Select-Object -First 1
          if (-not $asset) { $rel.assets.name; Write-Error '找不到 Mesa 发布包' }
          "Mesa $($rel.tag_name)：$($asset.name)"
          $dir = Join-Path $env:RUNNER_TEMP 'mesa'
          Invoke-WebRequest $asset.browser_download_url -OutFile "$dir.7z"
          7z x "$dir.7z" "-o$dir" -y | Out-Null
          $gui = Join-Path $env:RUNNER_TEMP 'gui'
          New-Item -ItemType Directory -Force $gui | Out-Null
          Copy-Item target\release\egress-guard-gui.exe $gui
          Copy-Item (Join-Path $dir 'x64\*.dll') $gui
          Get-ChildItem $gui | Select-Object Name, Length
      - name: 复制粘贴：界面与系统剪贴板互通（Ctrl+C / Ctrl+V）
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'clipboard.json'
          Set-Clipboard -Value 'before'
          $err = Join-Path $env:RUNNER_TEMP 'clipboard.err'
          $p = Start-Process (Join-Path $env:RUNNER_TEMP 'gui\egress-guard-gui.exe') -ArgumentList '--clipboard-selftest', $out, '16' -PassThru -RedirectStandardError $err
          Start-Sleep 8
          if ($p.HasExited) { Get-Content $err -ErrorAction SilentlyContinue; Write-Error "自检窗口启动失败（退出码 $($p.ExitCode)）" }
          $copied = Get-Clipboard -Raw
          if ($copied -ne 'egress-guard-copy-ok') { Write-Error "界面里复制的文字没有到系统剪贴板：$copied" }
          else { 'OK：界面里复制的文字到了系统剪贴板' }
          Set-Clipboard -Value '203.0.113.7'
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('^v')
          if (-not $p.WaitForExit(30000)) { $p.Kill(); Write-Error '自检窗口没有按时退出' }
          $pasted = (Get-Content $out -Raw | ConvertFrom-Json).pasted
          "输入框内容：$pasted"
          if ($pasted -ne '203.0.113.7') { Write-Error 'Ctrl+V 没有把系统剪贴板的内容粘贴进输入框' }
          else { 'OK：Ctrl+V 把系统剪贴板的内容粘贴进了输入框' }
      - name: 泄露测试（命令行，DNS 与 WebRTC）
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod https://api.ipify.org).Trim()
          $cfg = Join-Path $env:RUNNER_TEMP 'leak.toml'
          "whitelist = [`"$ip`"]`n[ui]`nappearance = `"light`"" | Set-Content -Encoding utf8 $cfg
          target\release\egress-guard.exe -c $cfg leak-test
          if ($LASTEXITCODE -ne 0) { Write-Error "泄露测试失败（退出码 $LASTEXITCODE）" }
          $json = Join-Path $env:RUNNER_TEMP 'leak.json'
          target\release\egress-guard.exe -c $cfg leak-test --json | Set-Content -Encoding utf8 $json
          # 依赖外部服务：结果只打印；但输出必须是完整的 JSON，并且至少测了默认路由
          $r = Get-Content -Raw $json | ConvertFrom-Json
          if (-not $r.webrtc.report.paths) { Write-Error 'WebRTC 没有测试任何路径' }
          "DNS：$($r.dns.summary.text)$($r.dns.error)"
          "WebRTC：$($r.webrtc.summary.text)"
      - name: 界面截图：泄露测试（浅色、深色）
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          $shots = Join-Path $env:RUNNER_TEMP 'shots'
          New-Item -ItemType Directory -Force $shots | Out-Null
          $cfg = Join-Path $env:RUNNER_TEMP 'leak.toml'
          foreach ($look in 'light', 'dark') {
            (Get-Content -Raw $cfg) -replace 'appearance = "\w+"', "appearance = `"$look`"" | Set-Content -Encoding utf8 $cfg
            $p = Start-Process (Join-Path $env:RUNNER_TEMP 'gui\egress-guard-gui.exe') -ArgumentList '-c', $cfg, '--page', 'leaktest', '--leak-test' -PassThru
            Start-Sleep 40
            # PowerShell 会把 $null 转成空字符串传给 string 参数，要用 [NullString]::Value
            $h = [Win]::FindWindow([NullString]::Value, '出口 IP 网络控制 - egress-guard')
            $r = New-Object Win+RECT
            if ($h -ne [IntPtr]::Zero -and [Win]::GetWindowRect($h, [ref]$r)) {
              [Win]::SetForegroundWindow($h) | Out-Null
              Start-Sleep 1
              $x, $y, $w, $hh = $r.Left, $r.Top, ($r.Right - $r.Left), ($r.Bottom - $r.Top)
            } else {
              Write-Warning '找不到界面窗口，截全屏'
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $x, $y, $w, $hh = 0, 0, $b.Width, $b.Height
            }
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($x, $y, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $shots "leaktest-$look.png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep 2
          }
          Get-ChildItem $shots | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/shots/
      - uses: actions/upload-artifact@v4
        with:
          name: egress-guard-windows
          path: |
            target/release/egress-guard.exe
            target/release/egress-guard-gui.exe
            config.example.toml

  macos:
    name: macOS 构建与端到端测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: 网络扩展共用代码的单元测试（Swift）
        run: |
          mkdir -p target/macos
          xcrun swiftc -O -o target/macos/feedtest macos/Shared/*.swift macos/Tests/main.swift
          target/macos/feedtest
      - name: 打包 .app（通用二进制，含网络扩展）
        run: |
          scripts/macos/bundle.sh --universal
          EXT="target/macos/Egress Guard.app/Contents/Library/SystemExtensions/com.egressguard.app.filter.systemextension"
          lipo -info "$EXT/Contents/MacOS/com.egressguard.app.filter"
          plutil -p "$EXT/Contents/Info.plist"
          codesign -dvv "$EXT" 2>&1 | head -20
      - name: 端到端测试（pf 全局断网、按应用断网的规则推送）
        run: scripts/macos/ci-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egress-guard-macos
          path: target/macos/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: target/macos/shots/
