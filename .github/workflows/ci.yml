name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: 单元测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: egress-guard-windows
          path: |
            target/release/egress-guard.exe
            target/release/egress-guard-gui.exe
            config.example.toml

  macos:
    name: macOS 构建与端到端测试
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: 打包 .app（通用二进制）
        run: scripts/macos/bundle.sh --universal
      - name: 端到端测试（pf 全局断网）
        run: scripts/macos/ci-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egress-guard-macos
          path: target/macos/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: target/macos/shots/
