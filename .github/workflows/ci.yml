name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: 单元测试（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    name: Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: egress-guard-windows
          path: |
            target/release/egress-guard.exe
            target/release/egress-guard-gui.exe
            config.example.toml

  macos:
    name: macOS 构建与端到端测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: 网络扩展共用代码的单元测试（Swift）
        run: |
          mkdir -p target/macos
          xcrun swiftc -O -o target/macos/feedtest macos/Shared/*.swift macos/Tests/main.swift
          target/macos/feedtest
      - name: 打包 .app（通用二进制，含网络扩展）
        run: |
          scripts/macos/bundle.sh --universal
          EXT="target/macos/Egress Guard.app/Contents/Library/SystemExtensions/com.egressguard.app.filter.systemextension"
          lipo -info "$EXT/Contents/MacOS/com.egressguard.app.filter"
          plutil -p "$EXT/Contents/Info.plist"
          codesign -dvv "$EXT" 2>&1 | head -20
      - name: 端到端测试（pf 全局断网、按应用断网的规则推送）
        run: scripts/macos/ci-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egress-guard-macos
          path: target/macos/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshots
          path: target/macos/shots/
