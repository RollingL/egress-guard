name: 发布

# 合并到 main 后，如果 Cargo.toml 里的版本还没有发布过，先对同一个提交跑一遍完整的 CI（ci.yml），
# 通过后构建 Windows、macOS 两个安装包，创建 GitHub Release（标签 v<版本>）。
# 界面的「检查更新」读取的就是这里的最新发布。也可以在 Actions 页面手动运行（只能针对 main）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 是否需要发布
    # 手动运行也只发布 main 上的提交
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 版本号以 Cargo 元数据为准（不靠文本匹配）
          V=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "egress-guard") | .version')
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::读不出版本号：$V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # 只有 404 才算「还没发布」；鉴权失败、限流、服务错误都让发布失败，而不是重复发布
          if out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" 2>&1); then
            echo "v$V 已经发布过，跳过"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q "HTTP 404" <<<"$out"; then
            echo "::error::查询发布失败：$out"
            exit 1
          fi
          # 标签已经存在、却指向别的提交：不能把这个提交的安装包挂到别人的标签上
          if tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$V" --jq '.object.sha' 2>&1); then
            if [[ "$tag" != "$GITHUB_SHA" ]]; then
              # 附注标签指向标签对象，再取一层
              tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq '.object.sha' 2>/dev/null || echo "$tag")
            fi
            [[ "$tag" == "$GITHUB_SHA" ]] || { echo "::error::标签 v$V 已存在并指向 $tag，不是 $GITHUB_SHA"; exit 1; }
          elif ! grep -q "HTTP 404" <<<"$tag"; then
            echo "::error::查询标签失败：$tag"
            exit 1
          fi
          echo "将发布 v$V"
          echo "release=true" >> "$GITHUB_OUTPUT"

  ci:
    name: 发布前的完整测试
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows 安装包
    needs: [check, ci]
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: 打包
        shell: pwsh
        run: |
          $v = '${{ needs.check.outputs.version }}'
          $dir = "dist\egress-guard-v$v-windows"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target\release\egress-guard.exe, target\release\egress-guard-gui.exe, config.example.toml, README.md $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\egress-guard-v$v-windows.zip"
      - name: 冒烟测试：解开最终的 zip 再运行
        shell: pwsh
        run: |
          $v = '${{ needs.check.outputs.version }}'
          $zip = "dist\egress-guard-v$v-windows.zip"
          $x = Join-Path $env:RUNNER_TEMP 'smoke'
          Expand-Archive $zip -DestinationPath $x -Force
          foreach ($f in 'egress-guard.exe', 'egress-guard-gui.exe', 'config.example.toml', 'README.md') {
            if (-not (Test-Path (Join-Path $x $f))) { Write-Error "zip 里缺少 $f" }
          }
          $out = & (Join-Path $x 'egress-guard.exe') --version
          if ($out -notmatch [regex]::Escape($v)) { Write-Error "版本不符：$out" }
          # 记录摘要，发布时与上传后的远端资产逐一核对
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$sha  egress-guard-v$v-windows.zip" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256

  macos:
    name: macOS 安装包
    needs: [check, ci]
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: 打包 .app（通用二进制）
        run: |
          scripts/macos/bundle.sh --universal
          mkdir -p dist
          cp target/macos/egress-guard-*-macos.zip "dist/egress-guard-v${{ needs.check.outputs.version }}-macos.zip"
      - name: 冒烟测试：解开最终的 zip 再运行
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          zip="dist/egress-guard-v$V-macos.zip"
          x="$RUNNER_TEMP/smoke"
          rm -rf "$x" && mkdir -p "$x" && ditto -x -k "$zip" "$x"
          app="$x/Egress Guard.app"
          for f in egress-guard egress-guard-gui; do
            [[ -x "$app/Contents/MacOS/$f" ]] || { echo "::error::zip 里缺少 $f"; exit 1; }
            lipo -archs "$app/Contents/MacOS/$f" | grep -q arm64 || { echo "::error::$f 不是通用二进制"; exit 1; }
            lipo -archs "$app/Contents/MacOS/$f" | grep -q x86_64 || { echo "::error::$f 不是通用二进制"; exit 1; }
          done
          out=$("$app/Contents/MacOS/egress-guard" --version)
          [[ "$out" == *"$V"* ]] || { echo "::error::版本不符：$out"; exit 1; }
          codesign --verify --deep "$app" || { echo "::error::签名校验失败"; exit 1; }
          (cd dist && shasum -a 256 "egress-guard-v$V-macos.zip" > "egress-guard-v$V-macos.zip.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*.zip
            dist/*.zip.sha256

  release:
    name: 创建 GitHub Release
    needs: [check, ci, windows, macos]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: 核对安装包就是冒烟测试过的那两个
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          cd dist
          for f in "egress-guard-v$V-windows.zip" "egress-guard-v$V-macos.zip"; do
            [[ -s "$f" && -s "$f.sha256" ]] || { echo "::error::缺少 $f 或它的摘要"; exit 1; }
            sha256sum -c "$f.sha256"
          done
      # 草稿续传、标签绑定、资产摘要核对，全部通过才公开；见 scripts/release/publish.sh
      - name: 创建或续传发布，核对后公开
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/publish.sh "${{ needs.check.outputs.version }}" "$GITHUB_SHA" dist
